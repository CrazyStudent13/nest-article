name: nest-acticle

services:
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nest-db}
      TZ: Asia/Shanghai
    # performance-schema 关闭 + 小缓冲池：2G 内存机器瘦身，个人博客规模无感知
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --performance-schema=OFF --innodb-buffer-pool-size=128M
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./apps/server/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # 2G 机器兜底：限制单容器最坏内存，避免任一进程拖垮整机（实测空闲 ~128M）
    mem_limit: 640m
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${MYSQL_ROOT_PASSWORD:-root123}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: ${IMAGE_PREFIX:-ghcr.io/crazystudent13/nest-acticle}-server:latest
    container_name: blog-server
    restart: unless-stopped
    mem_limit: 500m
    environment:
      NODE_ENV: production
      SERVER_PORT: ${SERVER_PORT:-8080}
      # 文档开关：镜像固定 NODE_ENV=production（prod.yml 关闭），本地/内网想看接口文档在 .env 设 true
      SWAGGER_ENABLE: ${SWAGGER_ENABLE:-false}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nest-db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      JWT_SECRETKEY: ${JWT_SECRETKEY:?必须在 .env 配置 JWT_SECRETKEY}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_SECURE: ${MAIL_SECURE:-true}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - server_upload:/app/apps/server/upload
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    image: ${IMAGE_PREFIX:-ghcr.io/crazystudent13/nest-acticle}-client:latest
    container_name: blog-client
    restart: unless-stopped
    mem_limit: 350m
    environment:
      # apiBase 走同源相对路径（nginx 反代 /api、/profile，SSR 相对请求由 Nitro 代理路由转发），
      # 不再依赖局域网 IP；特殊部署仍可用 NUXT_PUBLIC_API_BASE 覆盖为绝对地址
      NUXT_API_PROXY_TARGET: ${NUXT_API_PROXY_TARGET:-http://server:8080}
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-}
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      - server

  blog-nginx:
    image: nginx:alpine
    container_name: blog-nginx
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - '${BLOG_PORT:-8888}:80'
    volumes:
      - ./deploy/nginx/blog.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/api-docs.html:/usr/share/nginx/html/api-docs.html:ro
      - ./deploy/nginx/swagger-ui:/usr/share/nginx/html/swagger-ui:ro
    depends_on:
      - client
      - server

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    image: ${IMAGE_PREFIX:-ghcr.io/crazystudent13/nest-acticle}-admin:latest
    container_name: blog-admin
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - '${ADMIN_PORT:-8081}:80'
    volumes:
      - ./deploy/nginx/api-docs.html:/usr/share/nginx/html/api-docs.html:ro
      - ./deploy/nginx/redoc.html:/usr/share/nginx/html/redoc.html:ro
      - ./deploy/nginx/swagger-ui:/usr/share/nginx/html/swagger-ui:ro
      - ./deploy/nginx/redoc:/usr/share/nginx/html/redoc:ro
    depends_on:
      - server

  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
    image: ${IMAGE_PREFIX:-ghcr.io/crazystudent13/nest-acticle}-docs:latest
    container_name: blog-docs
    restart: unless-stopped
    mem_limit: 32m
    # 不映射宿主端口：经 blog-nginx 的 /manual/ 反代访问（与 VitePress base 逐字对应）

volumes:
  mysql_data:
  redis_data:
  server_upload:
