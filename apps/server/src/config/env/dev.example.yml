# 开发环境配置模板（monorepo 版）
# 复制本文件为同目录下的 dev.yml 后填入真实配置；dev.yml 已被 .gitignore 忽略，不会入库。
#
# monorepo 必须保持的两处约定（改了会登录失败/404）：
#   1. app.prefix 固定为 'api'（博客/管理端均按 /api/... 访问）
#   2. perm.router.whitelist 中 controller 路由必须带 /api 前缀
#      （守卫用 req.route.path 匹配，含全局前缀；静态/文档路径除外）
#
# 本地快速起步：先 `docker compose up -d mysql redis`，再用下面 db/redis 的默认值即可。

app:
  port: 8080                    # 服务端口
  prefix: 'api'                 # API访问前缀（monorepo 统一，勿改）
  file:
    storageType: 'local'        # 文件存储类型：minio | rustfs | local
    location: './upload'        # 本地存储路径（相对 apps/server 运行目录）
    domain: 'http://localhost:8080'  # 文件访问域名
    serveRoot: '/profile'       # 文件虚拟路径
    maxSize: 10                 # 文件大小限制 (MB)
    # 上传扩展名白名单（逗号分隔；未配置使用内置默认名单，.svg/.html 等可内联类型已刻意排除）
    # allowedExts: '.jpg,.png,.pdf,.docx,.zip'

# 邮件配置（注册邮箱验证码）
# enabled 为 true 且 host/user/pass 齐全时，注册页启用邮箱验证码；否则保持图片验证码
mail:
  enabled: false
  host: ''
  port: 465
  secure: true
  user: ''
  pass: ''
  from: ''

# MinIO 对象存储配置（保留兼容）
minio:
  endPoint: ''
  port: 9000
  useSSL: false
  accessKey: ''
  secretKey: ''
  bucket: ''
  region: 'us-east-1'
  domain: ''

# RustFS 对象存储配置
rustfs:
  endPoint: ''
  port: 9000
  useSSL: false
  accessKey: ''
  secretKey: ''
  bucket: ''
  region: 'us-east-1'
  domain: ''

# 腾讯云cos配置（保留兼容）
cos:
  secretId: ''
  secretKey: ''
  bucket: ''
  region: ''
  domain: ''

# 数据库配置（默认值与根目录 .env.example / docker compose 保持一致）
db:
  mysql:
    host: '127.0.0.1'
    username: 'root'
    password: 'root123'
    database: 'nest-db'
    port: 3306
    charset: 'utf8mb4'
    logger: 'file'
    synchronize: false          # 表结构统一由 db/init.sql 维护
    logging: true               # 是否开启 SQL 日志
    extra:
      connectionLimit: 20
      connectTimeout: 30000
      enableKeepAlive: true
      keepAliveInitialDelay: 0
      maxIdle: 10
      idleTimeout: 60000

# redis 配置
redis:
  host: '127.0.0.1'
  password: ''
  port: 6379
  db: 2                         # Redis 数据库编号
  keyPrefix: ''
  retryStrategy:
    maxRetries: 5
    retryDelay: 3000
  enableOfflineQueue: true

# jwt 配置（joi 校验：secretkey 非空，否则拒绝启动；生产务必换强随机值）
jwt:
  secretkey: 'dev-only-secret-change-me'
  expiresin: '24h'
  refreshExpiresIn: '7d'

# 日志配置
log:
  dir: 'logs'
  level: 'info'
  maxFiles: '30d'
  maxSize: '20m'

# swagger 配置
swagger:
  enable: true
  path: 'api-docs'

# 权限配置 - 白名单路由（不需要 token 验证的接口）
perm:
  router:
    whitelist:
      - path: '/api/login'
        method: 'POST'
      - path: '/api/register'
        method: 'POST'
      - path: '/api/captchaImage'
        method: 'GET'
      - path: '/api/logout'
        method: 'POST'
      - path: '/api/swagger-ui(.*)'
      - path: '/api/docs(.*)'
      - path: '/api/openapi.json'
      - path: '/profile/(.*)'
