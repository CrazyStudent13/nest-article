server {
    listen 80;
    server_name localhost;

    # 外层还有代理（1Panel/云负载均衡）时还原真实客户端 IP；仅信任内网来源，公网直连无法伪造
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    
    root /usr/share/nginx/html;
    index index.html;

    # 动态解析上游：后端容器重建会换 IP，静态写死 proxy_pass http://server 会缓存
    # 旧 IP 直到 nginx 重启（曾致管理端全部 API 502）；走 Docker 内置 DNS 按请求解析后免维护
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_server server;

    # 开启 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    
    # 处理前端路由 - 所有请求都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 永不缓存：部署新版后浏览器立即拿到新入口（SPA 回退经 try_files 内部重定向也会命中此处）
    # 静态资源文件名带内容 hash，可放心 30d 长缓存
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # 静态资源缓存优化
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # API 请求代理到后端容器（后端已启用 /api 全局前缀，保留原始路径转发）
    # ^~ 防止以 .png 等结尾的 API 路径被下方静态资源正则拦截
    location ^~ /api/ {
        proxy_pass http://$upstream_server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传大小上限，与后端 app.file.maxSize 10MB 对齐（预留 multipart 开销）
        client_max_body_size 12m;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /swagger-ui {
        return 301 /swagger-ui/;
    }

    # 接口文档页静态托管：nginx 直出 HTML + 本地资产（deploy/nginx/api-docs.html，页面读 /api/openapi.json）
    # 规格由服务端 live 输出、swagger.enable 一个开关管控：生产关闭、开发开放；nginx 静态托管保留为开发态旁路
    # （页面出内容需服务端开启文档，服务端关着时规格 404、页面只剩空壳）。
    # 服务端 setupApiDocs 的文档路由挂在全局前缀下（/api/swagger-ui、/api/docs、/api/openapi.json），
    # 经上方 ^~ /api/ 反代可达，也可绕过本静态页直连服务端页面
    location /swagger-ui/ {
        root /usr/share/nginx/html;
        try_files $uri /api-docs.html =404;
    }

    location = /docs {
        root /usr/share/nginx/html;
        try_files /redoc.html =404;
    }

    # 根路径规格封死兜底：规格统一走 /api/openapi.json（随 swagger.enable 开关），根路径无路由、
    # 这里再拦一层防历史链接或日后误挂根路径时规格经入口泄露
    location = /openapi.json {
        return 404;
    }
    
    # 图片资源代理（本地存储：上传文件由后端静态服务 /profile 暴露）
    location ^~ /uploads/ {
        proxy_pass http://$upstream_server:8080;
    }

    location ^~ /profile/ {
        proxy_pass http://$upstream_server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
